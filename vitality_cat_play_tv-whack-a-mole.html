<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Đập Chuột - Timer & Score</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #4ade80; 
            background-image: radial-gradient(#22c55e 20%, transparent 20%), radial-gradient(#22c55e 20%, transparent 20%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            overflow: hidden;
            touch-action: manipulation;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-board {
            display: grid;
            position: relative;
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(5, 1fr);    
            gap: 10px;
            width: 100vw;
            height: 100vh;
            padding: 20px;
            padding-top: 90px; /* Space for the top scoreboard */
            box-sizing: border-box;
            max-width: 800px;
            margin: 0 auto;
        }

        .slot {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .hole {
            position: absolute;
            bottom: 15%;
            width: 85%;
            height: 40%;
            background: #3e2723;
            border-radius: 50%;
            box-shadow: inset 0 -8px 15px rgba(0,0,0,0.8);
            z-index: 10; /* Bottom layer */
        }

        .grass-cover {
            position: absolute;
            bottom: 0;
            width: 105%;
            height: 25%;
            background: #4ade80;
            z-index: 20; /* Grass layer below the text */
            border-radius: 50% 50% 0 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }

        /* CENTER WATERMARK CONTAINER */
        #watermark-layer {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30; /* ABOVE grass layer, BELOW moles */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none; /* Allow clicks to pass through */
            width: 110%;
            opacity: 0.95;
        }

        .mole {
            position: absolute;
            bottom: -100%;
            width: 65%;
            height: 75%;
            border-radius: 50px 50px 15px 15px;
            cursor: pointer;
            z-index: 40; /* Moles layer on top to overlap the text */
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
        }

        .mole::before {
            content: '';
            position: absolute;
            top: 25%;
            left: 20%;
            width: 15%;
            height: 15%;
            background: white;
            border-radius: 50%;
            box-shadow: 25px 0 0 white, 12px 18px 0 pink;
        }
        .mole::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 25%;
            width: 6%;
            height: 6%;
            background: black;
            border-radius: 50%;
            box-shadow: 25px 0 0 black;
        }

        .mole.up { bottom: 30%; }

        .mole.color-1 { background-color: #8b4513; } /* Brown */
        .mole.color-2 { background-color: #64748b; } /* Gray */
        .mole.color-3 { background-color: #eab308; } /* Yellow */

        .mole.whacked {
            background-color: #ef4444 !important; 
            transform: scaleY(0.4) scaleX(1.1); 
            bottom: 15%;
            transition: all 0.1s;
        }

        /* Start overlay */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        /* Game Over screen */
        #game-over-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 150;
            display: none; /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

    </style>
</head>
<body>

    <!-- Start screen -->
    <div id="start-overlay">
        <h1 class="text-4xl font-black tracking-widest text-green-400 drop-shadow-md mb-2">WHACK-A-MOLE</h1>
        <p class="text-xl font-bold">CLICK TO START</p>
    </div>

    <!-- Game Over screen -->
    <div id="game-over-overlay">
        <h1 class="text-5xl font-black mb-4 tracking-widest text-red-500 drop-shadow-lg">TIME'S UP!</h1>
        <p class="text-2xl mb-8 font-bold">FINAL SCORE: <span id="final-score" class="text-orange-400 text-5xl ml-3">0</span></p>
        <button id="restart-btn" class="bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white font-black py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 text-2xl tracking-wider border-2 border-white/50">
            PLAY AGAIN
        </button>
    </div>

    <!-- Timer & Score UI -->
    <div id="ui-layer" class="absolute top-6 left-0 w-full flex justify-center gap-4 z-50 pointer-events-none">
        <div class="bg-white/90 backdrop-blur-md px-6 py-2 rounded-full shadow-lg border border-white/50 text-xl font-black text-gray-800 uppercase tracking-widest">
            Time: <span id="time-value" class="text-blue-600 font-extrabold ml-1">60</span>
        </div>
        <div class="bg-white/90 backdrop-blur-md px-6 py-2 rounded-full shadow-lg border border-white/50 text-xl font-black text-gray-800 uppercase tracking-widest">
            Score: <span id="score-value" class="text-orange-500 font-extrabold ml-1">0</span>
        </div>
    </div>

    <div id="game-board">
        
        <!-- Watermark with precise Z-index alignment -->
        <div id="watermark-layer">
            <div class="bg-black/60 backdrop-blur-sm text-white font-black px-6 py-2 rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.5)] border border-white/20 text-xl md:text-3xl tracking-wide text-center">
                Cat Play TV Games (@CatPlayTVGames)
            </div>
            <div class="bg-[#cc0000] text-white font-black px-6 py-3 rounded-full shadow-[0_4px_15px_rgba(204,0,0,0.5)] flex items-center gap-3 text-lg md:text-2xl tracking-widest border border-white/30 uppercase">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                Subscribe my YouTube channel
            </div>
        </div>

    </div>

    <script>
        const gameBoard = document.getElementById('game-board');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const restartBtn = document.getElementById('restart-btn');
        
        const scoreValue = document.getElementById('score-value');
        const timeValue = document.getElementById('time-value');
        const finalScore = document.getElementById('final-score');
        
        let holes = [];
        const TOTAL_HOLES = 20;
        let gameStarted = false;
        let score = 0; 
        let timeLeft = 60;
        let countdownTimer;

        // --- AUDIO SYSTEM ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playFunSound(type) {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.1, now + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } 
            else if (type === 'whack1') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1500, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } 
            else if (type === 'whack2') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
            else if (type === 'whack3') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function startGame() {
            if (gameStarted) return;
            initAudio();
            startOverlay.style.opacity = '0';
            setTimeout(() => startOverlay.style.display = 'none', 300);
            
            // Reset data
            score = 0;
            timeLeft = 60;
            scoreValue.textContent = score;
            timeValue.textContent = timeLeft;
            gameStarted = true;
            
            // Start mole popping sequence
            peep();
            setTimeout(peep, 1000);

            // Start countdown timer
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeValue.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameStarted = false; 
            clearInterval(countdownTimer);
            
            // Force all active moles to hide
            holes.forEach(hole => {
                const mole = hole.querySelector('.mole');
                mole.classList.remove('up', 'whacked');
            });

            // Show final result
            finalScore.textContent = score;
            gameOverOverlay.style.display = 'flex';
        }

        startOverlay.addEventListener('click', startGame);
        startOverlay.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, { passive: false });
        
        restartBtn.addEventListener('click', () => {
            gameOverOverlay.style.display = 'none';
            startGame();
        });

        // --- CREATE BOARD ---
        function createBoard() {
            for (let i = 0; i < TOTAL_HOLES; i++) {
                const slot = document.createElement('div');
                slot.classList.add('slot');
                
                const hole = document.createElement('div');
                hole.classList.add('hole');
                
                const grass = document.createElement('div');
                grass.classList.add('grass-cover');

                const mole = document.createElement('div');
                mole.classList.add('mole');
                
                mole.addEventListener('mousedown', whack);
                mole.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    whack.call(mole, e);
                });

                slot.appendChild(hole);
                slot.appendChild(mole);
                slot.appendChild(grass);
                
                gameBoard.appendChild(slot);
                holes.push(slot);
            }
        }

        function randomTime(min, max) { return Math.round(Math.random() * (max - min) + min); }
        function randomHole(holesList) { return holesList[Math.floor(Math.random() * holesList.length)]; }

        // --- MOLE LOGIC ---
        function whack(e) {
            if (!e.isTrusted || !gameStarted) return;
            if (!this.classList.contains('up')) return;
            
            score++;
            scoreValue.textContent = score;

            const soundTypes = ['whack1', 'whack2', 'whack3'];
            playFunSound(soundTypes[Math.floor(Math.random() * soundTypes.length)]);

            this.classList.add('whacked');
            this.classList.remove('up');
        }

        function peep() {
            if (!gameStarted) return; // Stop if time is up

            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            if (mole.classList.contains('up') || mole.classList.contains('whacked')) {
                return peep();
            }

            const timeOnScreen = randomTime(900, 1800); 
            
            mole.classList.remove('color-1', 'color-2', 'color-3', 'whacked');
            mole.classList.add('color-' + randomTime(1, 3));
            mole.classList.add('up');
            
            playFunSound('pop');
            
            setTimeout(() => {
                mole.classList.remove('up', 'whacked');
                
                // Prevent recursive calls if Game Over triggers during timeout
                if (gameStarted) {
                    setTimeout(peep, randomTime(300, 800));
                }
            }, timeOnScreen);
        }

        createBoard();

    </script>
</body>
</html>
